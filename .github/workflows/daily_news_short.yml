name: Global Breaking News YouTube Shorts

on:
  schedule:
    # Runs twice every day: 06:00 UTC and 18:00 UTC (11:00 AM & 11:00 PM PKT)
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Allows instant manual trigger whenever breaking viral news occurs

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Latest News, Generate Short & Upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_PRIVACY: ${{ secrets.VIDEO_PRIVACY || 'public' }}
        run: |
          python run_pipeline.py

      - name: Commit Updated News History
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json || true
          git commit -m "chore: record covered news event to prevent duplicates [skip ci]" || true
          git push || true

      - name: Upload Video Artifact (Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-news-shorts
          path: output/*.mp4
          retention-days: 7
