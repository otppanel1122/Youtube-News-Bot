name: 24/7 Global Breaking News Monitor

on:
  schedule:
    # Runs every 30 minutes 24/7
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  monitor-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation

      - name: Install Python Dependencies & Node Engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install

      - name: Monitor Global News & Upload High-Heat Shorts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_PRIVACY: ${{ secrets.VIDEO_PRIVACY || 'public' }}
        run: |
          python run_pipeline.py

      - name: Commit and Push Updated News History
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json || true
          git commit -m "chore: record covered news event to prevent duplicates [skip ci]" || true
          git push || true

      - name: Upload Video Artifact (Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-news-shorts
          path: output/*.mp4
          retention-days: 7
